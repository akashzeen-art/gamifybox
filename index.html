<!DOCTYPE html>
<html lang="ar-IQ" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حمل هنا! للوصول إلى محتواك!</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="content content--landing">
    <header class="header">
      <div class="header__switch">
        <select id="language-select" class="modern-select" aria-label="Language">
          <option value="ar-IQ">AR</option>
          <option value="en-IQ">EN</option>
        </select>
      </div>
    </header>

    <main class="main main--landing">
      <img
        class="main__form-logo"
        src="./assets/logo.png"
        alt="حمل هنا! للوصول إلى محتواك!"
        title="حمل هنا! للوصول إلى محتواك!"
        width="170"
        height="170"
      >

      <div class="boxForm boxForm--landing">
        <div class="step-container step-container-single-step0">
          <h1 class="form-title form-title--ready" data-i18n-html="ready">
            محتواك<br><strong>جاهز الآن!</strong>
          </h1>
          <button type="button" class="btn-form" id="nextStep" data-i18n="continue">
            استمر »
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    window.GAMIFY_PAGE = "landing";
  </script>
  <script src="./app.js"></script>
</body>
</html>
